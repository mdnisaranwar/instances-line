<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotstar Clone</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f1014;
      color:white;
    }

    /* Navbar */

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 40px;
      background:#141b29;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#1f80e0;
    }

    .menu{
      display:flex;
      gap:20px;
    }

    .menu a{
      text-decoration:none;
      color:white;
      transition:0.3s;
    }

    .menu a:hover{
      color:#1f80e0;
    }

    /* Banner */

    .banner{
      width:100%;
      height:400px;
      background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200') center/cover;
      display:flex;
      align-items:center;
      padding-left:50px;
    }

    .banner-content{
      max-width:500px;
    }

    .banner h1{
      font-size:50px;
      margin-bottom:15px;
    }

    .banner p{
      margin-bottom:20px;
      line-height:1.5;
    }

    .btn{
      padding:12px 25px;
      background:#1f80e0;
      border:none;
      color:white;
      font-size:16px;
      border-radius:5px;
      cursor:pointer;
    }

    .btn:hover{
      background:#0b5cad;
    }

    /* Movies */

    .section{
      padding:30px 40px;
    }

    .section h2{
      margin-bottom:20px;
    }

    .movies{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .card{
      width:220px;
      background:#1b1e26;
      border-radius:10px;
      overflow:hidden;
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.05);
    }

    .card img{
      width:100%;
      height:300px;
      object-fit:cover;
    }

    .card-content{
      padding:15px;
    }

    .card h3{
      margin-bottom:10px;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#141b29;
      margin-top:30px;
    }

    @media(max-width:768px){

      .navbar{
        flex-direction:column;
        gap:15px;
      }

      .banner{
        height:300px;
        padding:20px;
      }

      .banner h1{
        font-size:35px;
      }

      .movies{
        justify-content:center;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->

  <div class="navbar">
    <div class="logo">Hotstar</div>

    <div class="menu">
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">TV</a>
      <a href="#">Sports</a>
      <a href="#">Premium</a>
    </div>
  </div>

  <!-- Banner -->

  <div class="banner">
    <div class="banner-content">
      <h1>Avengers Endgame</h1>
      <p>
        Watch your favorite movies and web series online in HD quality.
      </p>

      <button class="btn" onclick="watchNow()">
        Watch Now
      </button>
    </div>
  </div>

  <!-- Movie Section -->

  <div class="section">
    <h2>Trending Movies</h2>

    <div class="movies">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=800">

        <div class="card-content">
          <h3>Movie One</h3>
          <button class="btn" onclick="playMovie('Movie One')">
            Play
          </button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?q=80&w=800">

        <div class="card-content">
          <h3>Movie Two</h3>
          <button class="btn" onclick="playMovie('Movie Two')">
            Play
          </button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=800">

        <div class="card-content">
          <h3>Movie Three</h3>
          <button class="btn" onclick="playMovie('Movie Three')">
            Play
          </button>
        </div>
      </div>

    </div>
  </div>

  <footer>
    © 2026 Hotstar Clone Project
  </footer>

  <script>

    function watchNow(){
      alert("Movie Started!");
    }

    function playMovie(movie){
      alert(movie + " is Playing...");
    }

  </script>

</body>
</html>
